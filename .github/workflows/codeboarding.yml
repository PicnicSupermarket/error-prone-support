# Posts an architecture diagram of the changes in a pull request, using
# CodeBoarding. See https://www.codeboarding.org and
# https://github.com/CodeBoarding/CodeBoarding-action.
name: Visualize architecture changes
on:
  pull_request:
    paths: [ '**/*.java', .github/workflows/codeboarding.yml ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  review:
    name: Review architecture changes with CodeBoarding
    # Analysis of code in forked repositories is skipped, as such workflow runs
    # do not receive the OIDC credentials required to use the hosted LLM.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      actions: read # To reuse analyses of earlier runs.
      contents: read
      id-token: write # To authenticate against CodeBoarding's hosted LLM.
      issues: write # To post the architecture review as a PR comment.
      pull-requests: write # To post the architecture review as a PR comment.
    runs-on: ubuntu-24.04
    steps:
      - name: Install Harden-Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo-and-containers: true
          # XXX: Replace with an explicit `allowed-endpoints` list, based on the
          # outbound calls observed in audit mode.
          egress-policy: audit
      - name: Review architecture changes
        uses: CodeBoarding/CodeBoarding-action@fad289f4d6f3af66b361d65858b0dbe7ad991297 # v1.16.2
        with:
          llm: hosted
