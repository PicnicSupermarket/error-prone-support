# XXX: Instead of this workflow, look into workflow that runs any time a `push`
# event workflow against the default branch completes, and then updates the
# merge guard on all open PRs that target the default branch, based on whether
# all workflows against the head SHA (a) completed and (b) were successful.
# If that workflow would also run on a `push` to the default branch (thus
# blocking any further merges until all workflow succeed) and on `pull_request`
# events for new PRs (to assign an initial check state), that would make for a
# more robust guard less susceptible to race conditions.
name: Require that all checks on the default branch pass
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.base_ref == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    steps:
      - name: Install Harden-Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo-and-containers: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Check default branch health
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prLabels = context.payload.pull_request?.labels ?? [];
            if (prLabels.some((l) => l.name === 'disable-default-branch-health-gate')) {
              core.info('Label "disable-default-branch-health-gate" present; skipping default branch health check.');
              return;
            }

            // Only consider completed workflow runs triggered by a push event
            // against the default branch: other events (such as
            // `issue_comment` and `schedule`) do not reflect that branch's
            // health, while runs that have yet to complete do not (yet) have
            // an outcome to report. A single page of results suffices, as the
            // most recent runs are returned first.
            const defaultBranch = context.payload.repository.default_branch;
            const { data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: defaultBranch,
              event: 'push',
              status: 'completed',
              per_page: 100,
            });
            if (runs.length === 0) {
              core.setFailed(`Found no completed push event workflow runs against ${defaultBranch}; unable to establish its health.`);
              return;
            }

            // Retain each workflow's most recent outcome. Such an outcome need
            // not pertain to the default branch's current head commit: a
            // workflow that is still running against a more recent commit does
            // not invalidate what its last completed run reported. Run IDs
            // increase monotonically, and re-runs update the associated run in
            // place, so the run with the highest ID per workflow reports that
            // workflow's most recent outcome.
            const latestByWorkflow = new Map();
            for (const run of runs) {
              const existing = latestByWorkflow.get(run.workflow_id);
              if (!existing || run.id > existing.id) {
                latestByWorkflow.set(run.workflow_id, run);
              }
            }
            core.info(`Found ${runs.length} completed push event workflow runs; ${latestByWorkflow.size} unique workflows.`);

            // XXX: Until a workflow completes its first run against a new
            // commit, that commit is judged by the workflow's prior outcome,
            // so a regression goes unnoticed for the duration of that run. See
            // the comment at the top of this file.
            const successConclusions = new Set(['neutral', 'skipped', 'stale', 'success']);
            const failures = [...latestByWorkflow.values()].filter(
              (run) => !successConclusions.has(run.conclusion),
            );

            if (failures.length > 0) {
              const details = failures
                .map((run) => `  - ${run.name} @ ${run.head_sha.slice(0, 7)}: ${run.conclusion} (${run.html_url})`)
                .join('\n');
              core.setFailed(`Default branch has ${failures.length} failing workflow(s):\n${details}`);
            } else {
              core.info('The most recent run of each workflow against the default branch is green.');
            }
