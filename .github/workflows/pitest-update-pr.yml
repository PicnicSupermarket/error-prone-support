# Updates a pull request based on the corresponding mutation testing analysis
# performed by the `pitest-analyze-pr.yml` workflow. See
# https://blog.pitest.org/oss-pitest-pr/ for details.
name: Post mutation test results
on:
  workflow_run:
    workflows: ["Run mutation tests"]
    types: [ completed ]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.conclusion }}
  cancel-in-progress: true
permissions: {}
env:
  MAVEN_ARGS: --batch-mode -Dstyle.color=always -T1C
jobs:
  update-pr:
    name: Update PR with mutation test results
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read # To download the analysis artifact from the triggering workflow run.
      checks: write # To annotate surviving mutants using a check run.
      contents: read
      pull-requests: write # To post a summary as a PR comment.
    runs-on: ubuntu-24.04
    steps:
      - name: Install Harden-Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo-and-containers: true
          allowed-endpoints: >
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
      - name: Check out code and set up JDK and Maven
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          java-version: 25.0.4
          java-distribution: temurin
          maven-version: 3.9.16
      - name: Download Pitest analysis artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pitest-reports
          path: ./target/pit-reports-ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -DrepoToken="${GITHUB_TOKEN}" pitest-github:updatePR
