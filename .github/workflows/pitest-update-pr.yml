# Updates a pull request based on the corresponding mutation testing analysis
# performed by the `pitest-analyze-pr.yml` workflow. See
# https://blog.pitest.org/oss-pitest-pr/ for details.
name: Post mutation test results
on:
  workflow_run:
    workflows: ["Run mutation tests"]
    types: [ completed ]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.conclusion }}
  cancel-in-progress: true
permissions: {}
env:
  MAVEN_ARGS: --batch-mode -Dstyle.color=always -T1C
jobs:
  update-pr:
    name: Update PR with mutation test results
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read # To download the analysis artifact from the triggering workflow run.
      checks: write # To annotate surviving mutants using a check run.
      contents: read
      id-token: write # To let Secure Registry verify the repository and runner.
      pull-requests: write # To post a summary as a PR comment.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Install Harden-Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo-and-containers: true
          allowed-endpoints: >
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
          secure-registry: true
      - name: Check out code and set up JDK and Maven
        uses: s4u/setup-maven-action@5d4481650d2563723ad6c5e8f009ac8fd746e3e8 # v1.22.0
        with:
          java-version: 25.0.5
          java-distribution: temurin
          maven-version: 3.10.1
      - name: Download Pitest analysis artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pitest-reports
          path: ./target/pit-reports-ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -DrepoToken="${GITHUB_TOKEN}" pitest-github:updatePR
