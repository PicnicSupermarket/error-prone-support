# Updates a pull request based on the corresponding mutation testing analysis
# performed by the `pitest-analyze-pr.yml` workflow. See
# https://blog.pitest.org/oss-pitest-pr/ for details.
name: Post mutation test results
on: # zizmor: ignore[dangerous-triggers] the documented GitHub pattern for posting elevated-permission comments on fork PRs from a trusted, non-fork trigger
  workflow_run:
    workflows: ["Run mutation tests"]
    types: [ completed ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
env:
  MAVEN_ARGS: --batch-mode -Dstyle.color=always -T1C
jobs:
  update-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read # Needed to download the Pitest artifact from the triggering workflow run.
      checks: write # Needed to annotate surviving mutants on the corresponding lines.
      contents: read
      pull-requests: write # Needed to post the mutation testing summary as a pull request comment.
    runs-on: ubuntu-24.04
    steps:
      - name: Install Harden-Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo-and-containers: true
          allowed-endpoints: >
            api.adoptium.net:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
      - name: Check out code and set up JDK and Maven
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          java-version: 25.0.4
          java-distribution: temurin
          maven-version: 3.9.16
      - name: Download Pitest analysis artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pitest-reports
          path: ./target/pit-reports-ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update PR
        run: mvn -DrepoToken="${{ secrets.GITHUB_TOKEN }}" pitest-github:updatePR
